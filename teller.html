<!DOCTYPE html>
<html lang="id"><head>
    <title>Panel Teller - MTsN 2 Brebes</title>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script>tailwind.config={theme:{extend:{fontFamily:{sans:["Plus Jakarta Sans","sans-serif"]}}}}</script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">
    <header class="bg-slate-900 text-white px-6 py-3 shadow-md flex justify-between items-center z-10 border-b border-slate-800">
        <div class="flex items-center space-x-3"><div class="bg-emerald-600 text-white p-2 rounded-lg"><i class="fa-solid fa-sliders text-xl"></i></div>
            <div><h1 class="font-bold text-lg leading-tight tracking-wide">PANEL TELLER / LOKET</h1><p class="text-xs text-slate-400">MTs Negeri 2 Brebes - Pelayanan Terpadu Satu Pintu</p></div></div>
        <div class="flex items-center space-x-3"><div class="text-right px-4 py-1 bg-slate-800 rounded-lg border border-slate-700 hidden md:block"><div id="clockTime" class="text-lg font-bold text-emerald-400 font-mono">00:00:00</div><div id="clockDate" class="text-[10px] text-slate-400 uppercase tracking-wider"></div></div><a href="index.html" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-lg border border-slate-700 text-sm"><i class="fa-solid fa-tv mr-1"></i> Layar</a></div></header>
    <main class="flex-grow p-4 md:p-6 max-w-5xl mx-auto w-full grid md:grid-cols-2 gap-6 items-start">
        <section class="bg-white rounded-3xl shadow-md border border-slate-200 p-6 space-y-5">
            <div class="grid grid-cols-3 gap-3">
                <label class="col-span-2 text-xs font-semibold text-slate-500">Loket<select id="loket" class="mt-1 w-full border border-slate-300 rounded-xl p-2.5 text-sm text-slate-800"></select></label>
                <label class="text-xs font-semibold text-slate-500">PIN<input id="pin" type="password" inputmode="numeric" class="mt-1 w-full border border-slate-300 rounded-xl p-2.5 text-sm text-slate-800"></label>
            </div>
            <div class="text-center bg-slate-50 rounded-2xl py-6 border border-slate-100">
                <div class="text-xs text-slate-500 uppercase tracking-wider font-semibold">Nomor Saat Ini</div>
                <div id="curNum" class="text-7xl font-extrabold text-slate-900 tracking-tight">-</div>
                <div class="mt-2 text-sm text-slate-500">Menunggu: <b id="waitNum" class="text-emerald-700 text-lg">0</b> orang</div>
            </div>
            <button id="btnNext" onclick="act('panggil')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-4 rounded-2xl font-extrabold text-lg shadow flex items-center justify-center gap-2"><i class="fa-solid fa-volume-high"></i> Panggil Selanjutnya</button>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="act('ulang')" class="bg-slate-800 hover:bg-slate-900 text-white py-2.5 rounded-xl text-sm font-bold"><i class="fa-solid fa-rotate-right mr-1"></i> Ulangi Panggilan</button>
                <button onclick="act('reset')" class="bg-amber-600 hover:bg-amber-700 text-white py-2.5 rounded-xl text-sm font-bold"><i class="fa-solid fa-rotate-left mr-1"></i> Reset Semua</button>
            </div>
        </section>
        <section class="bg-white rounded-3xl shadow-md border border-slate-200 p-6">
            <h2 class="font-bold text-slate-800 mb-3">Ringkasan Semua Loket</h2>
            <table class="w-full text-sm"><thead><tr class="text-xs text-slate-500 text-left border-b"><th class="py-1.5 px-2">Loket</th><th class="px-2">Layanan</th><th class="px-2 text-center">Dipanggil</th><th class="px-2 text-center">Menunggu</th></tr></thead><tbody id="summary" class="divide-y divide-slate-100"></tbody></table>
        </section>
    </main>
    <div id="toastNotification" class="fixed bottom-14 left-1/2 -translate-x-1/2 bg-slate-900/90 text-white text-xs px-4 py-2 rounded-full shadow-lg border border-slate-700 z-50 transition-all duration-300 opacity-0 pointer-events-none flex items-center gap-2"><i class="fa-solid fa-circle-info text-emerald-400"></i><span id="toastMessage"></span></div>
    <script src="js/config.js"></script><script src="js/common.js"></script><script src="js/teller.js"></script>
</body></html>
